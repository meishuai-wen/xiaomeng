name: CI

on:
  push:
    branches:
      - main
      - phase-1-foundation
  pull_request:
    branches:
      - main

jobs:
  swift:
    name: Swift 测试与构建
    runs-on: macos-15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 显示 Swift 版本
        run: swift --version

      - name: 运行测试
        run: swift test

      - name: 构建 App
        run: swift build

      - name: 构建发布版可执行文件
        run: |
          swift build -c release
          mkdir -p dist
          cp .build/release/XiaomengApp dist/XiaomengApp

      - name: 上传 macOS 可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: XiaomengApp-macos
          path: dist/XiaomengApp
