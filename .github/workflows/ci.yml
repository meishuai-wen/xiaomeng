name: CI

on:
  push:
    branches:
      - main
      - phase-1-foundation
  pull_request:
    branches:
      - main

jobs:
  swift:
    name: Swift 测试与构建
    runs-on: macos-15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 显示 Swift 版本
        run: swift --version

      - name: 运行测试
        run: swift test

      - name: 构建 App
        run: swift build

      - name: 构建发布版可执行文件
        run: |
          swift build -c release
          mkdir -p dist/Xiaomeng.app/Contents/MacOS
          cp .build/release/XiaomengApp dist/Xiaomeng.app/Contents/MacOS/XiaomengApp
          chmod +x dist/Xiaomeng.app/Contents/MacOS/XiaomengApp
          cat > dist/Xiaomeng.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>XiaomengApp</string>
            <key>CFBundleIdentifier</key>
            <string>com.xiaomeng.speech-to-markdown</string>
            <key>CFBundleName</key>
            <string>小梦</string>
            <key>CFBundleDisplayName</key>
            <string>小梦</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSMicrophoneUsageDescription</key>
            <string>小梦需要访问麦克风，把你的语音转写为 Markdown 并粘贴到当前输入位置。</string>
          </dict>
          </plist>
          PLIST
          ditto -c -k --keepParent dist/Xiaomeng.app dist/XiaomengApp-macos.zip

      - name: 上传 macOS App
        uses: actions/upload-artifact@v4
        with:
          name: XiaomengApp-macos
          path: dist/XiaomengApp-macos.zip
